<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - FlipCard</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <ul class="cards">
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
            <li class="card"><div class="view front-view"><i class='bx bx-question-mark'></i></div><div class="view back-view"><i></i></div></li>
        </ul>

        <div class="details">
            <p class="time">Tiempo: <span><b>20</b>s</span></p>
            <p class="flips">Giros: <span><b>0</b></span></p>
            <button id="refresh">Reiniciar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
